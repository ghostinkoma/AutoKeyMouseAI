# AutoKeyMouse ボット設定 (MU Online Season 6 / エルフ)
# このファイルを config.yaml にコピーして編集する。
# ROI (領域) はすべてゲーム画面サイズに対する比率 [x, y, 幅, 高さ]。
# tools/vision_preview.py で枠を表示しながら合わせる。

device:
  transport: http          # http (Wi-Fi) | serial (COM ポート。USB が不安定な基板では http 推奨)
  port: COM18              # serial のとき
  host: 192.168.1.43       # ESP32 の IP (液晶 / シリアルに表示される) または autokeymouse.local

mouse:
  # auto     : 絶対座標で届く位置は一発移動、届かない位置 (別モニタ等) は相対移動で合わせ込む
  # absolute : 常に絶対座標 / relative : 常に相対移動 (遅いがどのモニタでも動く)
  # relative を使うときは Windows の「ポインターの精度を高める」を OFF にすると速く収束する
  mode: auto
  # tools/calibrate_mouse.py の出力を貼り付ける。null ならプライマリモニタ全体で計算
  abs_map: null

game:
  window_title: "MU"       # ゲームウィンドウのタイトルの一部
  # ゲームのプロセス名 (python tools\list_windows.py で確認)。指定するとブラウザのタブ等と取り違えない
  process: null            # 例: main.exe
  # 画面の撮り方
  #   auto        : ウィンドウから直接撮る (他のウィンドウが重なっても、仮想デスクトップを切り替えても撮れる)。
  #                 Windows Graphics Capture (要 pip install windows-capture) → PrintWindow → 画面 の順に試す
  #   obs         : OBS のゲームキャプチャからもらう (下の obs: を設定。仮想デスクトップを切り替えても撮れる)
  #   wgc / printwindow : その方式だけ / screen : 画面に映っているものを撮る (旧方式)
  #   auto で obs.enabled: true なら OBS を最優先で使う
  capture: auto
  require_foreground: true # ゲームが前面にないときは操作しない
  # この PC で押すとボット開始 / 停止 (仮想キーコード)。0x21 = PageUp, 0x22 = PageDown
  # 注意: ESP32 が送るキーもこの PC のキーとして見えるので、ボットが送るキー (helper.toggle_key 等) と重ねないこと
  start_key_vk: 0x21
  stop_key_vk: 0x22
  # PageUp で開始したときに 1 回だけ送るスクリプト (ESP32 のマクロ書式)。
  # 例: チャットで申請拒否コマンドを打つ (サーバーが対応していれば、パーティ・取引の申請が来なくなる)
  # start_script: "k:enter;w:300;t:/re off;k:enter;w:300"
  start_script: null

helper:
  # MU Helper のオン/オフを切り替えるキー (ゲーム側の割り当てに合わせる)
  # F12 は Windows がデバッガ用に予約しているキーで、ゲームが固まることがあるので使わない
  # PageUp / PageDown (ボットの開始・停止) とも重ねないこと
  toggle_key: home         # Murex では Home キーで MU Helper のオン/オフ
  # MU Helper の開始方法
  #   key   : toggle_key を押す (推奨。押したあと画面で再開を確認し、だめなら押し直す)
  #   auto  : 左上パネルの ▶ ボタンが見えればクリックして開始、見えなければ toggle_key
  #   click : 常に ▶ ボタンのクリック (見えなければ toggle_key)
  start_method: key
  initially_on: false      # ボット開始時に MU Helper が止まっている前提 (PageUp で開始すると Home で入れる)
  mouse_stops_helper: true # クリックすると MU Helper が止まる (拾得後に Home で入れ直す)
  stop_on_pause: true      # PageDown でボットを止めたら MU Helper も止める
  settle_ms: 800           # 切り替え後の待ち時間
  # 画面表示で ON/OFF を判定する場合 (左上の MU Helper パネルを切り出した画像)。未設定ならボットの操作から推定
  # 左上の MU Helper パネルの ▶ (開始) ボタンが見えていれば停止中、見えなければ動作中と判定する。
  # これで Home を押したあと本当に再開したかを画面で確認し、だめなら押し直す
  indicator:
    roi: [0.06, 0.0, 0.14, 0.045]     # 1680x1050 で実測した MU Helper パネル ("MU Helper" の文字と ▶ ボタン)
    on_image: null                    # 動作中の表示の画像があれば指定 (無くても可)
    off_image: templates/helper_off.png  # 停止中の ▶ ボタン
    panel_image: templates/helper_panel.png  # "MU Helper" の文字。見えないときは判定せずボットの操作から推定
    threshold: 0.8
  verify_attempts: 3       # 再開を画面で確認できなければ押し直す回数

loop_interval_ms: 50

# 現在地 (マップ名と座標) の読み取りと記録 (tools/map_logger.py)
maplog:
  roi: [0.86, 0.955, 0.14, 0.045]   # 画面右下 "Atlans (32, 68)" の表示 (ミニマップの下)。--check で確認して調整
  ocr: auto            # auto | winrt (Windows 標準) | tesseract
  tesseract_cmd: null  # Tesseract の場所 (既定 C:\Program Files\Tesseract-OCR\tesseract.exe)
  scale: 3             # OCR 前に拡大する倍率
  threshold: 130       # 文字とみなす明るさ (0-255)。読めなければ 100〜170 で調整
  interval_s: 0.5      # 読み取り間隔
  max_step: 12         # 1 回で動ける最大マス数 (これより飛んだら 2 回続けて読めたときだけ採用)
  heartbeat_s: 10      # 止まっていてもこの間隔で位置を記録
  db: data/mu_map.db   # 記録先 (SQLite)

# OBS Studio のゲームキャプチャから画面をもらう (別の仮想デスクトップにゲームを置いても液晶に映し続けたい場合)
#   1. OBS で「ソース +」→「ゲームキャプチャ」→ モード「特定のウィンドウをキャプチャ」→ MU (Main.exe) を選ぶ。
#      ソース名を下の source と同じにする (既定の名前は「ゲームキャプチャ」)
#   2. OBS の「ツール」→「WebSocket サーバー設定」→「WebSocket サーバーを有効にする」。パスワードを下に書く
#   3. pip install obsws-python
#   OBS は配信・録画しなくてよい (起動しておくだけ)
obs:
  enabled: false
  host: localhost
  port: 4455
  password: ""
  source: ゲームキャプチャ    # OBS のソース名 (見つからなければゲームキャプチャのソースを自動で探す)
  # 液晶やボットの画面に余白が出る場合、OBS の画像から切り出す範囲 [x, y, 幅, 高さ] (ピクセル) を指定する。
  # 起動時に出る "[screen] OBS の画像 WxH / ゲーム画面 WxH" を見て決める。null なら自動
  crop: null

# 割り込んでくるダイアログ (パーティ申請など) を自動で断る。
# ダイアログが出ている状態で tools/grab_templates.py を実行し、
#   detect: ダイアログだと分かる部分 (例: "パーティに招待" の文字や枠の見出し)
#   click : 断るボタン (Cancel / いいえ)。無ければ key を押す
# を切り出して保存し、下のコメントを外す
popups:
  # - name: party request
  #   detect: templates/party_request.png
  #   click: templates/party_cancel.png
  #   key: esc
  #   threshold: 0.8

# ゲーム画面を縮小して ESP32 (T-Display) の液晶に映す。状態 (STANDBY / RUN)・HP/MP・拾得数も重ねて表示
mirror:
  enabled: true
  interval_s: 0.1          # 送る間隔 (0.1 = 毎秒 10 枚)。ESP32 の負荷は mirror_only.py の表示 (CPU %) で確認
  format: jpeg             # jpeg (5〜10KB/枚, 推奨) | raw (64.8KB/枚)
  quality: 70              # JPEG 画質 (1-100)
  transport: auto          # tcp = 専用ポートに接続しっぱなし (速い) / http = 1 枚ずつ POST / auto = tcp を試して http
  port: 5005

hud:
  # 1680x1050 のウィンドウで実測 (Murex S6)。比率なので他のサイズでも概ね合う
  hp:
    roi: [0.274, 0.843, 0.058, 0.100]  # 左下の赤い HP 球の内側
    color: red
    direction: vertical
  mp:
    roi: [0.670, 0.846, 0.058, 0.100]  # 右下の青い MP 球の内側
    color: blue
    direction: vertical

vision:
  templates:
    enabled: true
    # 地面のアイテム名を探す範囲 (上のキルログ・下の UI を除く)
    search_roi: [0.0, 0.12, 1.0, 0.70]
    # チャット欄 (左下) は "Zen" などの文字が流れるので除外
    exclude_rois:
      - [0.0, 0.74, 0.30, 0.08]   # チャット欄
      - [0.43, 0.72, 0.13, 0.03]  # "Welcome to Rex Project"
      - [0.88, 0.74, 0.07, 0.03]  # "Events"
    # tools/grab_templates.py で切り出した画像を登録する。
    # 同じアイテムに複数枚登録すると (明るさ違いなど) 取りこぼしが減る
    # color: gold を付けると金色の文字だけで照合する (ラベル背景や地面の色に強い)
    targets:
      - {name: "Zen",               files: [templates/zen.png],          threshold: 0.8, color: gold}
      - {name: "Silver Medal",      files: [templates/silver_medal.png], threshold: 0.8, color: gold}
      # 宝石は tools/grab_templates.py で切り出してから有効にする (文字色が金色でなければ color を外す)
      # - {name: "Jewel of Bless",    files: [templates/bless.png],    threshold: 0.8, color: gold}
      # - {name: "Jewel of Soul",     files: [templates/soul.png],     threshold: 0.8, color: gold}
      # - {name: "Jewel of Chaos",    files: [templates/chaos.png],    threshold: 0.8, color: gold}
      # - {name: "Jewel of Life",     files: [templates/life.png],     threshold: 0.8, color: gold}
      # - {name: "Jewel of Creation", files: [templates/creation.png], threshold: 0.8, color: gold}
      # - {name: "Jewel of Guardian", files: [templates/guardian.png], threshold: 0.8, color: gold}
      # - {name: "Jewel of Harmony",  files: [templates/harmony.png],  threshold: 0.8, color: gold}
  # まだテンプレートの無いアイテム名ラベル (金色文字) を自動で dataset/labels/ に保存する。
  # 放置すれば "Jewel of Bless" などのラベル画像が溜まるので、名前を付けて templates/ に移せばテンプレートになる
  collect:
    enabled: true
    colors: [gold]
    interval_s: 1.0
  yolo:
    # 学習済みモデルを用意したら有効にする (README の「AI 検出」参照)
    enabled: false
    model: models/mu_s6.pt
    conf: 0.5
    class_kinds: {monster: monster}   # 記載のないクラスは item 扱い

elf:
  # helper: 攻撃は MU Helper に任せ、ボットは拾得・回復 (ポーション)・死亡復帰だけ
  # manual: 攻撃・バフ・Heal もボットが行う (MU Helper を使わない)
  mode: helper
  character_offset: [0.0, -0.08]   # キャラの位置 (画面中心からのずれ, 画面高さ比)

  attack:
    skill_key: "1"      # 攻撃スキル (Triple Shot / Multi-Shot など) を 1 に割り当てる
    directions: 8       # 何方向に撃つか (8 = 45 度ずつ)
    shots_per_direction: 2  # 1 方向あたりの右クリック回数 (矢は減らないので多めでよい)
    dwell_ms: 300       # 1 方向ごとの待ち
    radius: 0.18        # 狙う位置の半径 (画面高さ比)

  # 巡回: PageUp を押した地点を中心に、上下左右 range マスを順番に回り、着くたびに 8 方向へ撃つ。
  # その間は MU Helper が狩りをする。移動・射撃のクリックで止まった MU Helper は毎回 Home で再開 (画面で確認)
  patrol:
    enabled: true
    range: 5            # 中心から何マスまで動くか
    route: [[0, -1], [1, 0], [0, 1], [-1, 0]]   # 上 → 右 → 下 → 左 (range 倍)
    hunt_s: 20          # 1 地点で MU Helper に狩らせる秒数
    first_after_s: 3    # 開始から最初の巡回まで
    tile_px: [45, 32]   # 1 マスの画面上の大きさ (横, 縦)。動きすぎ/足りなければ調整
    walk_ms_per_px: 4   # 移動の待ち時間 (1 ピクセルあたり)
    volley: true        # 着いたら 8 方向に撃つ

  buffs:
    keys: ["2", "3"]    # 2 = Greater Defense, 3 = Greater Damage (自分に掛ける)
    interval_s: 60
    cast_ms: 700

  heal:                 # エルフの Heal で自己回復。使わないなら null
    key: "4"
    hp_below: 0.6
    cast_ms: 600
    cooldown_s: 1.5

  potions:
    hp_key: q
    hp_below: 0.4
    mp_key: w
    mp_below: 0.2
    cooldown_s: 1.0

  pickup:
    enabled: true
    targets: []         # 空なら vision で検出した item すべて (= 上の宝石と Zen)
    max_distance: 0.45  # キャラからこの距離 (画面高さ比) 以内だけ拾いに行く
    # クリック位置の候補 (ラベル高さ比, 下が +)。1 回目で拾えなければ次を試す
    #   [0, 3.0]: ラベルの下の実物 (Zen の金貨)   [0, 1.2]: すぐ下   [0, 0]: ラベルそのもの
    click_offsets: [[0.0, 3.0], [0.0, 1.2], [0.0, 0.0]]
    walk_timeout_s: 3.0
    attempts: 3
    ignore_s: 15        # 拾えなかったアイテムを無視する秒数
    return_to_anchor: true
    return_wait_ms: 800

  death:
    hp_zero_s: 3.0
    # 街で復活したあとに実行するスクリプト (ESP32 のマクロ書式)
    script: "w:10000;k:enter;w:300;t:/move lorencia;k:enter;w:5000"
