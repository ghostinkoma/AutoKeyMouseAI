; AutoKeyMouse firmware
;
; Arduino-ESP32 core 3.x を使うため、PlatformIO 公式 platform ではなく
; コミュニティ版 pioarduino の platform を使用する。
;
;   書き込み (COM)  : py -3.12 -m platformio run -e esp32 -t upload --upload-port COM18
;   シリアルモニタ  : py -3.12 -m platformio device monitor -p COM18 -b 115200
;
; 環境 (-e で選ぶ):
;   esp32      無印 ESP32 / Flash 16MB (LilyGO T-Display 16MB など)
;   esp32_4mb  無印 ESP32 / Flash 4MB
;   esp32s3    ESP32-S3 / Flash 16MB (DevKitC-1 互換 N16R8 など)

[platformio]
src_dir = AutoKeyMouse
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:esp32]
board = esp32dev
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

[env:esp32_4mb]
board = esp32dev
; アプリが 1.3MB を超えるので OTA 無しの大きいアプリ領域を使う
board_build.partitions = huge_app.csv

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    ; USB-UART ブリッジ側 (COM ポート) に Serial を出す
    -DARDUINO_USB_CDC_ON_BOOT=0
