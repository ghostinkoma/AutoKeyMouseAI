; AutoKeyMouse firmware
;
; Arduino-ESP32 core 3.x を使うため、PlatformIO 公式 platform ではなく
; コミュニティ版 pioarduino の platform を使用する。
;
;   書き込み (COM)  : py -3.12 -m platformio run -e esp32 -t upload --upload-port COM18
;   シリアルモニタ  : py -3.12 -m platformio device monitor -p COM18 -b 115200
;
; 環境 (-e で選ぶ):
;   esp32      無印 ESP32 / Flash 16MB (LilyGO T-Display 16MB など。TFT 表示あり)
;   esp32_4mb  無印 ESP32 / Flash 4MB
;   esp32s3    ESP32-S3 / Flash 16MB (DevKitC-1 互換 N16R8 など)

[platformio]
src_dir = AutoKeyMouse
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 921600 だと USB-UART によっては途中で書き込みが壊れるので控えめにする
upload_speed = 460800
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    ; T-Display の TFT (ST7789) 表示用
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit BusIO@^1.16.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:esp32]
board = esp32dev
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 無印 ESP32 / 16MB + TCP の受信窓を広げた版 (試験的)
; 既定の Arduino ライブラリは TCP の受信窓が 5,760 バイトしかなく、BLE と Wi-Fi の同居で往復 40ms 前後かかるため
; 受信は 5.7KB / 40ms ≒ 140KB/s で頭打ちになる (ミラーの fps が通信量で決まる原因)。
; 窓を 2 倍にして受信を速くする。ESP-IDF からライブラリを作り直すので、初回のビルドは 10〜20 分かかる。
;   py -3.12 -m platformio run -e esp32_bigwnd -t upload --upload-port COM18
[env:esp32_bigwnd]
extends = env:esp32
; ESP-IDF でビルドするときはパーティション表をプロジェクト内から探すので、同じ内容のコピーを使う
board_build.partitions = partitions_16MB.csv
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=11520
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=16

[env:esp32_4mb]
board = esp32dev
; アプリが 1.3MB を超えるので OTA 無しの大きいアプリ領域を使う
board_build.partitions = huge_app.csv

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; N16R8 (8MB Octal PSRAM)。ミラーの BadCodec 16bit 版 (約 69KB) は PSRAM に置く
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    ; USB-UART ブリッジ側 (COM ポート) に Serial を出す
    -DARDUINO_USB_CDC_ON_BOOT=0
