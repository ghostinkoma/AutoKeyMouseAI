; AutoKeyMouse firmware (ESP32-S3 N16R8 / 16MB Flash)
;
; Arduino-ESP32 core 3.x を使うため、PlatformIO 公式 platform ではなく
; コミュニティ版 pioarduino の platform を使用する。
;
;   ビルド          : pio run
;   書き込み (COM)  : pio run -t upload --upload-port COM5
;   シリアルモニタ  : pio device monitor -p COM5

[platformio]
src_dir = AutoKeyMouse

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; USB-UART ブリッジ側 (COM ポート) に Serial を出す
    -DARDUINO_USB_CDC_ON_BOOT=0
