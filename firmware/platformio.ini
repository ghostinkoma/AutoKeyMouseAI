; AutoKeyMouse firmware
;
; Arduino-ESP32 core 3.x を使うため、PlatformIO 公式 platform ではなく
; コミュニティ版 pioarduino の platform を使用する。
;
;   書き込み (COM)  : py -3.12 -m platformio run -e esp32_mirror -t upload --upload-port COM18
;   シリアルモニタ  : py -3.12 -m platformio device monitor -p COM18 -b 115200
;
;   (既定は esp32_mirror。-e を省略するとこれになる)
;
; BLE (キーボード・マウス) はどのビルドにも入れない (Wi-Fi に全振り。液晶ミラー専用)。
; BLE のコード (ble_hid.cpp など) は残してあり、AKM_MIRROR_ONLY=1 で外している。戻すときは [env] の
; lib_deps に NimBLE を戻し、build_flags の -DAKM_MIRROR_ONLY=1 と lib_ignore を外す (git の履歴の
; esp32_bigwnd も参照)
;
; 環境 (-e で選ぶ):
;   esp32_mirror       無印 ESP32 / Flash 16MB (LilyGO T-Display 16MB など)。TCP 受信窓 4 倍 + Wi-Fi の受信の束ね 16
;                      (既定。初回ビルドは ESP-IDF から作り直すので 10〜20 分)
;   esp32              esp32_mirror と同じ (前の書き込みの手順のまま使えるように)
;   esp32_mirror_iperf 試験用: 公式 iperf の設定 (lwIP の IRAM 化など) を足したもの (版の名前 -iperf)
;   esp32_mirror_rx    試験用 (打ち切り): 受け取りと展開を別々のタスクに (版の名前 -rx)
;   esp32_mirror_wnd2  受信窓 2 倍 (11.5KB)・Wi-Fi の受信の設定は既定 (比べるとき・メモリを空けたいとき)
;   esp32_mirror_wnd8  受信窓 8 倍 (46KB)・Wi-Fi の受信の束ね 32 (試験用)
;   esp32_4mb          無印 ESP32 / Flash 4MB
;   esp32s3            ESP32-S3 / Flash 16MB (DevKitC-1 互換 N16R8 など)

[platformio]
src_dir = AutoKeyMouse
default_envs = esp32_mirror

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 921600 だと USB-UART によっては途中で書き込みが壊れるので控えめにする
upload_speed = 460800
lib_deps =
    ; T-Display の TFT (ST7789) 表示用
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit BusIO@^1.16.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DAKM_MIRROR_ONLY=1
lib_ignore =
    NimBLE-Arduino

; 無印 ESP32 / 16MB。液晶ミラー専用 (BLE なし。Wi-Fi が電波を独占でき、メモリも空く)。
; TCP の受信窓 4 倍 (23KB) + Wi-Fi の受信の束ね (AMPDU の受信窓) 16 (frame-stream-43〜)。
; インデックス 256 色の動画で 16.6 → 20.0fps、受信待ちが約半分に (実測)。窓いっぱいに溜まると最大 23KB、
; Wi-Fi の受信用の固定の置き場で約 10KB 多くメモリを使う
[env:esp32_mirror]
board = esp32dev
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; ESP-IDF でビルドするときはパーティション表をプロジェクト内から探すので、同じ内容のコピーを使う
board_build.partitions = partitions_16MB.csv
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=23040
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
    CONFIG_LWIP_TCPIP_RECVMBOX_SIZE=64
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=16
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=64
    CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=y
    CONFIG_ESP_WIFI_RX_BA_WIN=16

; esp32_mirror と同じ (前の書き込みの手順 -e esp32 のまま使えるように)
[env:esp32]
extends = env:esp32_mirror

; 試験用: esp32_mirror + 公式 examples/wifi/iperf (ESP32) の設定のうち、メモリを増やさないもの
; (lwIP を IRAM に・lwIP の優先度 23・Wi-Fi の送信の束ね)。版の名前は -iperf
;   py -3.12 -m platformio run -e esp32_mirror_iperf -t upload --upload-port COM18
[env:esp32_mirror_iperf]
extends = env:esp32_mirror
build_flags =
    ${env.build_flags}
    '-DAKM_FW_TAG="-iperf"'
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=23040
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
    CONFIG_LWIP_TCPIP_RECVMBOX_SIZE=64
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=16
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=64
    CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=y
    CONFIG_ESP_WIFI_RX_BA_WIN=16
    CONFIG_LWIP_IRAM_OPTIMIZATION=y
    CONFIG_LWIP_TCPIP_TASK_PRIO=23
    CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=y
    CONFIG_ESP_WIFI_TX_BA_WIN=32

; 試験用 (打ち切り): 受け取りと展開・描画を別々のタスクにする。空きメモリが足りず、受け取りが 265〜500KB/s と
; 1 つのタスクの版 (700〜950KB/s) より遅かった (frame-stream-51)。コードは frame_stream_rx.cpp に残す
; 試験用: 受け取り (コア 0) と展開・描画 (コア 1) を別々のタスクにする (frame_stream_rx.cpp)。
; 展開している間も受け取りが止まらない。受け取りの状態はシリアル ([RX] 5 秒ごと) と /status の rx に出る。
; 版の名前は -rx。うまく動かなければ esp32_mirror に戻す
;   py -3.12 -m platformio run -e esp32_mirror_rx -t upload --upload-port COM18
[env:esp32_mirror_rx]
extends = env:esp32_mirror
build_flags =
    ${env.build_flags}
    -DAKM_RX_TASK=1
    '-DAKM_FW_TAG="-rx"'

; 受信窓 2 倍 (11.5KB)。Wi-Fi の受信の設定は既定。版の名前は -wnd2
;   py -3.12 -m platformio run -e esp32_mirror_wnd2 -t upload --upload-port COM18
[env:esp32_mirror_wnd2]
extends = env:esp32_mirror
build_flags =
    ${env.build_flags}
    '-DAKM_FW_TAG="-wnd2"'
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=11520
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=16

; 試験用: 受信窓 8 倍 (46KB) + Wi-Fi の受信の束ね 32。窓いっぱいに溜まると最大 46KB 使う
; (空きメモリに注意。/status の heapMin を見る)。版の名前は -wnd8
;   py -3.12 -m platformio run -e esp32_mirror_wnd8 -t upload --upload-port COM18
[env:esp32_mirror_wnd8]
extends = env:esp32_mirror
build_flags =
    ${env.build_flags}
    '-DAKM_FW_TAG="-wnd8"'
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=46080
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=64
    CONFIG_LWIP_TCPIP_RECVMBOX_SIZE=64
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=16
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=96
    CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=y
    CONFIG_ESP_WIFI_RX_BA_WIN=32

[env:esp32_4mb]
board = esp32dev
; アプリが 1.3MB を超えるので OTA 無しの大きいアプリ領域を使う
board_build.partitions = huge_app.csv

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; N16R8 (8MB Octal PSRAM)。ミラーの BadCodec 16bit 版 (約 69KB) は PSRAM に置く
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    ; USB-UART ブリッジ側 (COM ポート) に Serial を出す
    -DARDUINO_USB_CDC_ON_BOOT=0
